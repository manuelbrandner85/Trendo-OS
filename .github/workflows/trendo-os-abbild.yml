# Trendo OS als eigenständiges System (USB-Stick / externe SSD): baut das Abbild, prüft es und legt es im eigenen Vor-Release „trendo-os-abbild“ ab.
# Seit 13.11.2026 (Commercial Desktop Edition) getrennt von den Windows-Kundenreleases: läuft nur noch von Hand, nie automatisch bei einem Release.
# Wunsch 04.11.2026: „alles über GitHub“. GitHub erlaubt höchstens 2 GB je Datei – darum wird das Abbild in Teile zerlegt,
# jeder Teil und das Ganze mit Prüfsumme; Trendo setzt sie beim Schreiben auf den Stick wieder zusammen und prüft alles.
name: Trendo-OS-Abbild

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stand, aus dem das Abbild gebaut wird (Tag, z. B. v0.9.92)"
        required: true

permissions:
  contents: write

jobs:
  abbild:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TAG: ${{ inputs.tag }}
      CHANNEL: trendo-os-abbild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Platz schaffen (das Abbild braucht viel Platz)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Trendo für Linux veröffentlichen
        run: dotnet publish src/Trendo.App/Trendo.App.csproj -c Release -r linux-x64 --self-contained true -p:Version="${TAG#v}" -o linux-image/config/includes.chroot/opt/trendo

      - name: Abbild bauen und prüfen (Debian 13, live-build)
        run: |
          docker run --rm --privileged -v "$PWD":/w -w /w debian:trixie bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq live-build debootstrap xorriso squashfs-tools ca-certificates >/dev/null
            SKIP_PUBLISH=1 WORK=/tmp/trendo-lb bash linux-image/build.sh
            bash linux-image/tests/test-image.sh linux-image/out/trendo-os-p2-amd64.hybrid.iso'

      - name: In Teile zerlegen, Prüfsummen und Beschreibung
        run: |
          cd linux-image/out
          sudo chown -R "$USER" .
          ISO=trendo-os-p2-amd64.hybrid.iso
          split -b 1900M -d -a 2 "$ISO" TrendoOS-Abbild.part
          python3 - "$ISO" "${TAG#v}" <<'PY'
          import hashlib, json, os, sys, glob
          iso, ver = sys.argv[1], sys.argv[2]
          def sha(p):
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for b in iter(lambda: f.read(1 << 20), b''): h.update(b)
              return h.hexdigest()
          parts = [{"file": p, "sha256": sha(p), "bytes": os.path.getsize(p)} for p in sorted(glob.glob('TrendoOS-Abbild.part*'))]
          json.dump({"schema": 1, "version": ver, "bytes": os.path.getsize(iso), "sha256": sha(iso), "min_gb": 32, "parts": parts},
                    open('TrendoOS-Abbild.json', 'w'), indent=2)
          PY
          cat TrendoOS-Abbild.json

      - name: Im eigenen Abbild-Kanal ablegen (Vor-Release, nie „latest“)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd linux-image/out
          if ! gh release view "$CHANNEL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$CHANNEL" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$(git rev-parse HEAD)" --title "Trendo OS – bootfähiges Abbild (USB/SSD)" --notes "Zusatzvariante, nicht Teil des Windows-Kundenangebots. Gebaut aus $TAG."
          fi
          gh release upload "$CHANNEL" TrendoOS-Abbild.json TrendoOS-Abbild.part* --clobber --repo "$GITHUB_REPOSITORY"
